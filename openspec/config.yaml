schema: spec-driven

# Project context — shown to AI when creating artifacts.
context: |
  OKR-Ninja: an Agent Skill for Claude Code that audits OKRs on their "goodness"
  (quality of objectives and key results) and detects cross-project / cross-team
  alignment issues, in two modes selected by team count: portfolio mode
  (2+ teams) and single-team mode (one team, full-depth goodness review).

  The skill itself is markdown only — no app code. `install.py` (stdlib
  Python) installs, updates and packages it; it is the only definition of the
  runtime payload that ships (see CLAUDE.md's file map). The deliverable is the
  skill itself: SKILL.md (entry point, carrying the version), LICENSE (MIT,
  ships with every copy), references/ (goodness-rubric.md,
  alignment-taxonomy.md, report-format.md), and examples/ (two fixtures, each
  with planted defects and its own answer key; together they cover the full
  AP-XX/AL-XX catalog).

  Who it is for and what the report is for — reader personas per mode, the
  target use-case, the four-job priority order, distribution intent — lives
  only in README.md ("Who it's for, when it runs, and what it's for"). Read it
  before proposing anything that changes what the report is for, how deep it
  goes, or who it addresses.

  Conventions:
  - Each topic has exactly one owning file (see CLAUDE.md); no duplication.
  - SKILL.md stays under ~150 lines; deep material goes in references/.
  - Every finding the skill produces must trace to verbatim quoted evidence.
  - The skill is closed and self-contained — two modes, one skill, no external
    OKR-skill handoffs. Any description change must keep claiming both modes,
    keep the writing-new-OKRs-from-scratch exclusion, and name no other skill.
  - Quality gate for changes: structural checks + fixture eval (see
    .claude/skills/openspec-loop/phases/verify-gate.md).

rules:
  proposal:
    - Always include a "Non-goals" section
    - State which planted defects the change should newly catch, if the change
      touches detection behavior - naming them in whichever fixture(s) under
      examples/ cover the modes it touches (each fixture's answer key lists the
      modes it deliberately leaves to the other)
  tasks:
    - Any rubric/taxonomy change must include a matching before-and-after
      rewrite example and, when detection behavior changes, a fixture update

# Advisory guidance surfaced to the apply/archive workflows (OpenSpec 1.11.0+).
# Lives here rather than in the loop skill so a direct /opsx:archive — one that
# bypasses the loop — still sees the gate.
operations:
  archive:
    guidance:
      - Do not archive until the verify gate in
        .claude/skills/openspec-loop/phases/verify-gate.md is green on its own
        terms - that file defines which checks run, which fixture(s) under
        examples/ apply to the touched category, and who may run them (a fresh
        subagent, never the change's author). Never loosen the gate to pass.
